<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="author" content="Guilherme Lopes Martins">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/style-large.css">
    <script type="module" src="scripts/medicine.js" defer></script>
    <script src='https://kit.fontawesome.com/1944f62a56.js' crossorigin='anonymous'></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <button class="menu-button" id="menuButton" onclick="toggleSidebar()">☰</button>
    <div class="sidebar" id="sidebar">
        <a href="home.html">Home</a>
        <a href="students.html">Students</a>
    </div>
    <header>
        <h1>Medicine record</h1>
    </header>
    <main>
        <div>
            <table id="table">
            </table>
            <button id="add-medicine">Add</button>
        </div>
        <dialog id="medicine-dialog">
            <div class="form">
                <label for="name">Name</label>
                <input type="text" id="new-name">
                <label for="new-description">Description</label>
                <textarea id="new-description"></textarea>
                <label for="new-price">Price</label>
                <input type="number" name="new-price" id="new-price">
                <div>
                    <button id="cancel-medicine" class="cancel-button">Cancel</button>
                    <button id="save-medicine">Save</button>
                </div>
            </div>
        </dialog>
    </main>
    <footer>
